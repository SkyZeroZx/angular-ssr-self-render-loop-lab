# Apache httpd with mod_proxy. /api/ goes to the API, everything else to the SSR server.
# ProxyPreserveHost On passes Host on as the client sent it. With the default Off, Apache sends 127.0.0.1:4000
# and Angular answers every request with 400.
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
User www-data
Group www-data
ServerName example.test
ErrorLog /proc/self/fd/2
ProxyTimeout 90

<VirtualHost *:80>
  ServerName example.test
  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:4400/api/
  ProxyPass / http://127.0.0.1:4000/
</VirtualHost>
