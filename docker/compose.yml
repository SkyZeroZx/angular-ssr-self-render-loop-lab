name: ng-render-recursion

services:
  # One machine named like the site: the API, the SSR server and the proxy share its network,
  # as nginx and Node do on a VPS whose name points at the VPS itself.
  # CASE picks the image: http-client (default), http-resource, resolver, angular-20, angular-21, angular-22.
  site:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${CASE:-http-client}
    image: ng-render-recursion:${CASE:-http-client}
    hostname: example.test
    init: true
    mem_limit: ${MEMORY:-1g}
    environment:
      - NG_ALLOWED_HOSTS
      - NG_TRUST_PROXY_HEADERS
    ports:
      - 8080:80

  # nginx installed from the distro: DISTRO=ubuntu (default) or debian, RELEASE=24.04 (default), 22.04, 26.04, 13.
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx
      args:
        DISTRO: ${DISTRO:-ubuntu}
        RELEASE: ${RELEASE:-24.04}
    image: ng-render-recursion:nginx-${DISTRO:-ubuntu}-${RELEASE:-24.04}
    network_mode: service:site
    depends_on:
      - site

  # nginx.org's image with a hand-written nginx.conf: docker compose up -d site nginx-org
  nginx-org:
    image: nginx:${NGINX_VERSION:-1.30.7}
    profiles: [org]
    network_mode: service:site
    volumes:
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - site

  # In place of nginx: docker compose up -d site caddy
  caddy:
    image: caddy:${CADDY_VERSION:-2.11.9}
    profiles: [caddy]
    network_mode: service:site
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - site

  # In place of nginx: docker compose up -d site nginx-proxy-manager, then
  # sh ../tools/nginx-proxy-manager.sh adds the site as a proxy host through its API, as its UI does.
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:${NPM_VERSION:-2.17.1}
    profiles: [npm]
    network_mode: service:site
    environment:
      - INITIAL_ADMIN_EMAIL=lab@example.test
      - INITIAL_ADMIN_PASSWORD=lab-password-123
    volumes:
      - /data
      - /etc/letsencrypt
    depends_on:
      - site

  # In place of nginx: docker compose up -d site apache
  apache:
    image: httpd:${HTTPD_VERSION:-2.4.71}
    profiles: [apache]
    network_mode: service:site
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - site

  # In place of nginx: docker compose up -d site traefik
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.8.0}
    profiles: [traefik]
    network_mode: service:site
    command: [--entrypoints.web.address=:80, --providers.file.filename=/etc/traefik/routes.yml]
    volumes:
      - ./traefik.yml:/etc/traefik/routes.yml:ro
    depends_on:
      - site

  # In place of nginx: docker compose up -d site haproxy
  haproxy:
    image: haproxy:${HAPROXY_VERSION:-3.4.8}
    profiles: [haproxy]
    network_mode: service:site
    # The image runs as an unprivileged user, which can't bind port 80.
    user: root
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - site
