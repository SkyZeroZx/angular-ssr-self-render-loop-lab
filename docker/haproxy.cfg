# The site's only frontend. /api/ goes to the API, everything else to the SSR server.
# HAProxy passes Host on as the client sent it and, without "option forwardfor", adds no X-Forwarded-* header.
defaults
  mode http
  timeout connect 5s
  timeout client 90s
  timeout server 90s

frontend site
  bind :80
  use_backend api if { path_beg /api/ }
  default_backend ssr

backend api
  server api 127.0.0.1:4400

backend ssr
  server ssr 127.0.0.1:4000
