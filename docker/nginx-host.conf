# Same as nginx.conf, but $host drops the port from Host. X-Forwarded-Host is passed on as the client sent it.
events {}

http {
  server {
    listen 80;
    server_name example.test;

    location /api/ {
      proxy_pass http://127.0.0.1:4400;
    }

    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_set_header Host $host;
    }
  }
}
