# nginx on its own machine, in front of the site's. The site's name resolves to nginx.
events {}

http {
  server {
    listen 80;
    server_name example.test;

    location /api/ {
      proxy_pass http://site:4400;
    }

    location / {
      proxy_pass http://site:4000;
      proxy_set_header Host $http_host;
    }
  }
}
