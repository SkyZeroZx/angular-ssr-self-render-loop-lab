# The site's only server block. /api/ goes to the API, everything else to the SSR server.
# $http_host passes the Host header unchanged, the way the proxy_set_header docs show it.
events {}

http {
  server {
    listen 80;
    server_name example.test;

    location /api/ {
      proxy_pass http://127.0.0.1:4400;
    }

    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_set_header Host $http_host;
    }
  }
}
