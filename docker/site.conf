# The site, as a file in sites-enabled next to the distro's default site. Its only proxy
# settings are the proxy_params file that the nginx package ships.
server {
    listen 80;
    server_name example.test;

    location /api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:4400;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:4000;
    }
}
